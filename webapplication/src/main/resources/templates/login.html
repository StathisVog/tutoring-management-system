<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tutoring Management System</title>

    <link th:href="@{/css/themes.css}" rel="stylesheet">

    <link th:href="@{/css/navbar.css}" rel="stylesheet">
    <link th:href="@{/css/footer.css}" rel="stylesheet">
    <link th:href="@{/css/login.css}" rel="stylesheet">
    <style>
        .error-message { color: red; display: none; margin-bottom: 10px; }
    </style>
</head>
<body>

<nav th:replace="~{layout/navbar :: navbar}"></nav>

<div class="login-container">
    <div class="login-card">
        <h2>Login to the System</h2>
        <p class="subtitle">Enter your credentials to access your account</p>

        <div id="errorMessage" class="alert-error"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn-submit">Login</button>
        </form>

        <div class="login-footer">
            Don't have an account? <a th:href="@{/register}">Register here</a>
        </div>
    </div>
</div>

<footer th:replace="~{layout/footer :: footer}"></footer>

<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
