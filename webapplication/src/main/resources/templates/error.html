<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oops! Something went wrong</title>

    <link th:href="@{/css/themes.css}" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/error.css">
</head>
<body>

<div class="error-wrapper">
    <div class="error-card">

        <!--/*@thymesVar id="status" type=""*/-->
        <div id="errorData" class="d-none" th:data-status="${status}"></div>

        <div class="error-icon-container">
            <i id="errorIcon" class="fas fa-spinner fa-spin"></i>
        </div>

        <h1 id="errorTitle">Loading...</h1>
        <p id="errorDescription">Please wait while we figure out what went wrong.</p>

        <div class="error-actions">
            <button onclick="window.history.back()" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Go Back
            </button>
            <a href="/" class="btn btn-primary">
                <i class="fas fa-home"></i> Return to Homepage
            </a>
        </div>

    </div>
</div>

<script src="/js/error.js"></script>
</body>
</html>
