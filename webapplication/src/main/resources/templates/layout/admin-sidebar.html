<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="sidebar" class="admin-sidebar">
    <div class="sidebar-header">
        <h3 class="header-text">ADMIN PANEL</h3>
        <i class="fas fa-user-shield header-icon" style="display: none;"></i>
    </div>

    <ul class="sidebar-nav">
        <li>
            <!--/*@thymesVar id="currentUri" type="java.lang.String"*/-->
            <a th:href="@{/admin/users}"
               th:class="${currentUri != null and #strings.startsWith(currentUri, '/admin/users') ? 'active' : ''}">
                <i class="fas fa-users-cog"></i> <span class="nav-text">User Management</span>
            </a>
        </li>
        <li>
            <!--/*@thymesVar id="currentUri" type="java.lang.String"*/-->
            <a th:href="@{/admin/courses}"
               th:class="${currentUri != null and #strings.startsWith(currentUri, '/admin/courses') ? 'active' : ''}">
                <i class="fas fa-book-open"></i> <span class="nav-text">Courses & Assignments</span>
            </a>
        </li>
        <li>
            <!--/*@thymesVar id="currentUri" type="java.lang.String"*/-->
            <a th:href="@{/admin/schedule}"
               th:class="${currentUri != null and #strings.startsWith(currentUri, '/admin/schedule') ? 'active' : ''}">
                <i class="fas fa-calendar-week"></i> <span class="nav-text">Global Timetable</span>
            </a>
        </li>
        <li>
            <!--/*@thymesVar id="currentUri" type="java.lang.String"*/-->
            <a th:href="@{/admin/enrollments}"
               th:class="${currentUri != null and #strings.startsWith(currentUri, '/admin/enrollments') ? 'active' : ''}">
                <i class="fas fa-inbox"></i> <span class="nav-text">Enrollment Inbox</span>
            </a>
        </li>
        <li>
            <!--/*@thymesVar id="currentUri" type="java.lang.String"*/-->
            <a th:href="@{/admin/audit}"
               th:class="${currentUri != null and #strings.startsWith(currentUri, '/admin/audit') ? 'active' : ''}">
                <i class="fas fa-clipboard-check"></i> <span class="nav-text">Audit & Overrides</span>
            </a>
        </li>
    </ul>

    <div class="sidebar-toggle-box">
        <button id="sidebarToggleBtn" class="sidebar-toggle-btn">
            <i class="fas fa-angle-double-left toggle-icon"></i> <span class="nav-text">Collapse Sidebar</span>
        </button>
    </div>
</aside>

</body>
</html>
