spring:
  application:
    name: tutoring-management-system

  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:database_schema/schema.sql

  # Java JSON Web Token (JJWT)
  jwt:
    secret: ${JWT_SECRET:c006ef539e4cf9a386f942526c238a8e9c2eadef35232fd6bb13063ef0e73d74}
    expiration: ${JWT_EXPIRATION:86400000}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/tutoring_management?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    defer-datasource-initialization: false
  #        dialect: org.hibernate.dialect.MySQLDialect

  thymeleaf:
    cache: false

server:
  port: ${SERVER_PORT:8080}

# Swagger Documentation
springdoc:
  swagger-ui:
    path: /docs